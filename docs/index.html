<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yari AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#110d13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="icon-btn" id="chatsToggle" aria-label="чаты" title="чаты">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </button>
        <div class="header-name-group" id="yariContactTrigger">
          <img class="brand-logo" src="yari-logo-white.svg" alt="Yari" style="height:80px; width:auto; display:block;" />
          <div class="header-name-stack">
            <span class="header-name-text">Yari</span>
            <span class="header-status" id="status">
              <span id="statusText">На связи</span>
              <span class="typing-dots" id="statusDots" style="display:none;"><span></span><span></span><span></span></span>
            </span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="new-chat-btn" id="newChatBtn" title="новый чат" aria-label="новый чат">+</button>
        <button class="icon-btn" id="profileToggle" aria-label="профиль" title="профиль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="app">
    <div class="guest-banner" id="guestBanner">
      <span>Гостевой режим: 1 чат, до 10 сообщений в день</span>
      <button id="guestBannerBtn">Войти / зарегистрироваться</button>
    </div>

    <div class="contact-gallery-overlay" id="contactGalleryOverlay">
      <button type="button" class="panel-close-btn" id="galleryCloseBtn" style="right:14px;" aria-label="закрыть галерею" title="закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="contact-gallery-title">Медиа</div>
      <div class="contact-gallery-grid" id="contactGalleryGrid"></div>
    </div>

    <div class="chats-panel" id="chatsPanel">
      <button type="button" class="panel-close-btn" id="chatsCloseBtn" aria-label="закрыть чаты" title="закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="panel-title">Чаты</div>
      <div class="chats-list" id="chatsList"></div>
    </div>

    <div class="profile-panel" id="profilePanel">
      <button type="button" class="panel-close-btn" id="profileCloseBtn" aria-label="закрыть профиль" title="закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="profile-identity" id="profileIdentity">
        <button class="profile-edit-btn" id="profileEditBtn" type="button" aria-label="редактировать аккаунт" title="редактировать аккаунт">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
        <div class="profile-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path>
          </svg>
        </div>
        <div class="profile-email" id="profileEmail"></div>

        <div class="profile-edit-menu" id="profileEditMenu">
          <div class="profile-edit-row">
            <label class="profile-section-label" for="newEmailInput">Изменить email</label>
            <div class="profile-edit-inline">
              <input type="email" id="newEmailInput" placeholder="новый email" autocomplete="email" />
              <button type="button" class="profile-icon-confirm" id="saveEmailBtn" aria-label="сохранить" title="сохранить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </button>
            </div>
            <div class="profile-edit-msg" id="emailEditMsg"></div>
          </div>
          <button type="button" class="profile-link-danger" id="deleteAccountBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
            <span class="label-text">удалить аккаунт</span>
          </button>
        </div>
      </div>
      <div>
        <div class="profile-section-label" id="bubbleColorLabel">Цвет твоих баблов</div>
        <div class="swatches" id="swatches">
          <button class="swatch" style="background:#e58fb0" data-color="#e58fb0" title="фуксия"></button>
          <button class="swatch" style="background:#8f7fe0" data-color="#8f7fe0" title="индиго"></button>
          <button class="swatch" style="background:#4fc3f7" data-color="#4fc3f7" title="неон-синий"></button>
          <button class="swatch" style="background:#6fc98f" data-color="#6fc98f" title="зелёный"></button>
          <button class="swatch" style="background:linear-gradient(135deg,#6fc98f 0%,#5fc2c2 50%,#4fc3f7 100%)" data-color="linear-gradient(135deg,#6fc98f 0%,#5fc2c2 50%,#4fc3f7 100%)" title="зелёно-синий"></button>
          <button class="swatch" style="background:linear-gradient(to top,#e6a3b4 0%,#f0be8c 100%)" data-color="linear-gradient(to top,#e6a3b4 0%,#f0be8c 100%)" title="закат"></button>
        </div>
      </div>
      <div>
        <div class="profile-section-label" id="bubbleRadiusLabel">Угловатость баблов</div>
        <div class="radius-row">
          <input type="range" id="radiusSlider" min="0" max="26" value="14" />
          <div class="radius-preview" id="radiusPreview"></div>
        </div>
      </div>
      <button type="button" class="profile-link-danger" id="profileLogoutBtn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="label-text">выйти</span>
      </button>
      <button type="button" class="profile-link-cta" id="profileLoginCta" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span class="label-text">войти / создать аккаунт</span>
      </button>

      <button type="button" class="referral-trigger" id="referralTrigger">
        <span>Реферальная ссылка</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>
    </div>

    <div class="referral-panel" id="referralPanel">
      <button type="button" class="panel-close-btn" id="referralCloseBtn" aria-label="закрыть" title="закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <svg class="referral-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
      <div class="referral-title">Реферальная ссылка</div>
      <div class="referral-link-box">
        <span id="referralLinkText">загрузка…</span>
        <button type="button" id="referralCopyBtn" title="копировать" aria-label="копировать"></button>
      </div>
      <div class="referral-terms" id="referralTermsText">
        Ваша реферальная ссылка. За каждого человека, который перешёл по ней и начал общение с Yari, вы получаете <strong>1 генерацию изображения</strong> и <strong>400 токенов</strong>.
      </div>
      <div class="referral-stat" id="referralStatText"></div>
    </div>

    <div class="auth-panel" id="authPanel">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" type="button">Вход</button>
        <button class="auth-tab" id="tabRegister" type="button">Регистрация</button>
      </div>
      <form class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="email" required autocomplete="email" />
        <input type="password" id="loginPassword" placeholder="пароль" required autocomplete="current-password" />
        <button type="submit">войти</button>
      </form>
      <a href="#" class="auth-forgot-link" id="forgotPasswordLink">забыли пароль?</a>
      <form class="auth-form" id="registerForm" style="display:none">
        <input type="email" id="registerEmail" placeholder="email" required autocomplete="email" />
        <input type="password" id="registerPassword" placeholder="пароль (от 6 символов)" required autocomplete="new-password" />
        <button type="submit">зарегистрироваться</button>
      </form>
      <form class="auth-form" id="forgotForm" style="display:none">
        <input type="email" id="forgotEmail" placeholder="email" required autocomplete="email" />
        <button type="submit">отправить код на почту</button>
      </form>
      <form class="auth-form" id="codeForm" style="display:none">
        <input type="text" id="codeInput" placeholder="код из письма" required inputmode="numeric" autocomplete="one-time-code" />
        <input type="password" id="codeNewPassword" placeholder="новый пароль (от 6 символов)" required autocomplete="new-password" />
        <button type="submit">сохранить новый пароль</button>
      </form>
      <form class="auth-form" id="resetForm" style="display:none">
        <input type="password" id="resetPassword" placeholder="новый пароль (от 6 символов)" required autocomplete="new-password" />
        <button type="submit">сохранить новый пароль</button>
      </form>
      <div class="auth-error" id="authError"></div>
    </div>

    <main class="chat" id="chat"></main>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" placeholder="напиши что-нибудь…" rows="1"></textarea>
        <button type="submit" id="send" aria-label="отправить" title="отправить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
